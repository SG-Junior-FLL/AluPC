[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "alupc"
version = "0.14.0"
description = "AluPC – zweiten Monitor steuern: Spiegeln, Erweitern, Kamera, Programme, Websites, eigene Szenen, Standbild, Bild-in-Bild, Fingerabdruck"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "PySide6>=6.8",
    "jeepney>=0.8; sys_platform == 'linux'",
    "pyserial>=3.5",
    "segno>=1.5",
]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
alupc = "alupc.app:main"

[tool.setuptools.packages.find]
include = ["alupc*"]

[tool.setuptools.package-data]
alupc = ["resources/*", "resources/icons/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
