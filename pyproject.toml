[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "alupc"
version = "0.88.0"
description = "AluPC – zweiten Monitor steuern: Spiegeln, Erweitern, Kamera, Programme, Websites, eigene Szenen, Standbild, Bild-in-Bild, Fingerabdruck"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "PySide6>=6.8",
    "jeepney>=0.8; sys_platform == 'linux'",
    "pyserial>=3.5",
    "segno>=1.5",
    # Seite „System“: Prozessor, Speicher, Laufwerke, Netzwerk, Akku, Programme
    "psutil>=5.9",
    # Sprachbefehle (offline): Vosk – Modell wird erst bei Bedarf heruntergeladen
    "vosk>=0.3.45",
    # Natürliche Stimme (Piper, offline) und genaue Erkennung (Whisper, offline) – Modelle erst bei Bedarf laden
    "piper-tts>=1.3",
    "faster-whisper>=1.1",
    # Windows: „Läuft gerade“ (globale Mediensteuerung – was Spotify, Browser … abspielen)
    "winrt-runtime>=2; sys_platform == 'win32'",
    "winrt-Windows.Foundation>=2; sys_platform == 'win32'",
    "winrt-Windows.Media.Control>=2; sys_platform == 'win32'",
    "winrt-Windows.Storage.Streams>=2; sys_platform == 'win32'",
]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
alupc = "alupc.app:main"

[tool.setuptools.packages.find]
include = ["alupc*"]

[tool.setuptools.package-data]
alupc = ["resources/*", "resources/icons/*", "assets/fonts/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
