name: Tests, Builds und Release

permissions:
  contents: write

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  test-linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Systembibliotheken für Qt
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 libpulse0 libnss3 \
            libxcomposite1 libxdamage1 libxrandr2 libxtst6 libasound2t64 libfontconfig1 libdbus-1-3 libxkbfile1
      - name: Installieren
        run: pip install -e ".[test]" av pytest-timeout
      - name: Tests
        run: |
          set -o pipefail
          python -X faulthandler -m pytest -v --timeout=240 2>&1 | tee tests.log || {
            # Fehler und Absturz-Stapel als Hinweise (ohne Anmeldung lesbar)
            grep -E "^(FAILED|E   |ERROR)|Fatal Python|File \"/home/runner/work" tests.log | head -40 | sed 's/^/::error::/'
            grep -B2 -A30 "Fatal Python" tests.log | grep -E "File|Fatal|line" | head -30 | sed 's/^/::warning::/'
            exit 1; }

  build-linux:
    # Ubuntu 22.04 als Basis: das Paket läuft damit auf Kubuntu 22.04, 24.04 und neuer
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Systembibliotheken für Qt
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 libpulse0 libnss3 \
            libxcomposite1 libxdamage1 libxrandr2 libxtst6 libasound2 libfontconfig1 libdbus-1-3 libxkbfile1 \
            libxcb-cursor0
      - name: Installieren
        # Nicht „-e“: PyInstaller findet Pakete aus einer Entwicklungs-Installation nicht
        run: pip install ".[test]" pyinstaller
      - name: Tests (Logik)
        run: pytest -v tests/test_logic.py
      - name: AluPC bauen (PyInstaller)
        run: >
          pyinstaller --noconfirm --windowed --name AluPC
          --paths .
          --collect-submodules alupc
          --collect-submodules serial
          --collect-submodules segno
          --collect-all vosk
          --collect-data alupc
          packaging/pyinstaller_entry.py
      - name: Fertiges Programm starten (Selbsttest)
        run: |
          QT_QPA_PLATFORM=offscreen dist/AluPC/AluPC --selbsttest "$RUNNER_TEMP/selbsttest.txt" || { cat "$RUNNER_TEMP/selbsttest.txt"; exit 1; }
          cat "$RUNNER_TEMP/selbsttest.txt"
      - name: Version bestimmen
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then echo "v=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT";
          else echo "v=$(python -c 'import alupc; print(alupc.__version__)')" >> "$GITHUB_OUTPUT"; fi
      - name: .deb-Paket bauen
        run: |
          packaging/linux/build_deb.sh "${{ steps.version.outputs.v }}"
          cp packaging/linux/AluPC-installieren.sh dist/
      - name: .deb installieren und starten (Test)
        run: |
          sudo apt-get install -y "./dist/alupc_${{ steps.version.outputs.v }}_amd64.deb"
          # echtes UxPlay (wie bei Kubuntu): die fertige Version darf ihm nicht ihre eigenen Bibliotheken
          # unterschieben (sonst „symbol lookup error“, Exit-Code 127)
          sudo apt-get install -y uxplay >/dev/null 2>&1 || echo "::warning title=UxPlay-Test::uxplay nicht installierbar"
          QT_QPA_PLATFORM=offscreen alupc --selbsttest "$RUNNER_TEMP/deb.txt" || { cat "$RUNNER_TEMP/deb.txt"; exit 1; }
          cat "$RUNNER_TEMP/deb.txt"
          if command -v uxplay >/dev/null; then
            line=$(grep "UxPlay: " "$RUNNER_TEMP/deb.txt" | head -1)
            echo "::notice title=UxPlay aus der fertigen Version::$line"
            if [ -z "$line" ]; then echo "::warning title=UxPlay-Test::keine UxPlay-Zeile im Selbsttest"
            elif ! echo "$line" | grep -qi "uxplay version\|uxplay 1\."; then
              echo "::error title=UxPlay startet nicht aus AluPC::$line"; exit 1
            fi
            # Bild direkt an AluPC (UxPlay 1.6x ohne -vrtp): baut UxPlay die Pipeline mit AluPCs Teilen?
            # Nur wenn diese UxPlay-Version -vd/-vc/-vs kennt (1.46 aus Ubuntu 22.04 nicht → AluPC nimmt das Fenster)
            if uxplay -h 2>&1 | grep -q "^-vc" && uxplay -h 2>&1 | grep -q "^-vd"; then
              timeout 6 uxplay -d -n AluPC-CI -nh -p -vd identity -vc identity \
                -vs "rtph264pay config-interval=1 pt=96 ! udpsink host=127.0.0.1 port=5600" > "$RUNNER_TEMP/ux.txt" 2>&1 || true
              if grep -q "Initialized GStreamer video renderer" "$RUNNER_TEMP/ux.txt"; then
                echo "::notice title=AirPlay-Bild an AluPC (RTP)::$(grep -A1 'video pipeline will be' "$RUNNER_TEMP/ux.txt" | tail -1)"
              else
                echo "::error title=AirPlay-Bildweg::UxPlay nimmt die RTP-Pipeline nicht an"; cat "$RUNNER_TEMP/ux.txt"; exit 1
              fi
            else
              echo "::notice title=AirPlay-Bildweg::$(uxplay -v 2>&1 | head -1) kennt -vd/-vc nicht – AluPC nutzt dort UxPlays Fenster"
            fi
          fi
      - name: Installationsskript – wartet, wenn die Paketverwaltung gesperrt ist („Sperrung nicht möglich“)
        run: |
          cp dist/alupc_*_amd64.deb dist/AluPC-installieren.sh "$RUNNER_TEMP/"
          # anderes Programm hält 15 s die dpkg-Sperre (wie Discover/automatische Updates)
          sudo bash -c 'exec 9>/var/lib/dpkg/lock-frontend; sleep 15' &
          sleep 1
          start=$(date +%s)
          sudo bash "$RUNNER_TEMP/AluPC-installieren.sh" < /dev/null | tee "$RUNNER_TEMP/inst.txt"
          took=$(( $(date +%s) - start ))
          echo "::notice title=Installationsskript::gewartet ${took} s · $(tail -1 "$RUNNER_TEMP/inst.txt")"
          grep -q "AluPC ist installiert" "$RUNNER_TEMP/inst.txt"
          test "$took" -ge 10
      - name: Spiegel-Probe unter X11 (Xvfb, echtes Bildschirmaufnehmen)
        continue-on-error: true
        run: |
          sudo apt-get install -y xvfb >/dev/null
          # Fehlen dem Qt-X11-Anschluss Systembibliotheken? (dann startet AluPC unter X11 nicht)
          plugin=$(find /opt/alupc -name libqxcb.so | head -1)
          ldd "$plugin" $(dirname "$plugin")/../../lib/libQt6XcbQpa.so.6 2>/dev/null | grep "not found" | sort -u | sed 's/^/::warning title=Linux-X11-Bibliotheken fehlen::/' || true
          set +e
          xvfb-run -a -s "-screen 0 1920x1080x24" env QT_QPA_PLATFORM=xcb /opt/alupc/AluPC --selbsttest "$RUNNER_TEMP/x11.txt" > "$RUNNER_TEMP/x11.out" 2>&1
          echo "::notice title=Linux-X11-Diagnose::Exit-Code $?"
          if grep -q '^DIAG' "$RUNNER_TEMP/x11.txt" 2>/dev/null; then
            grep '^DIAG' "$RUNNER_TEMP/x11.txt" | sed 's/^DIAG /::notice title=Linux-X11-Diagnose::/'
          else
            tail -n 15 "$RUNNER_TEMP/x11.txt" "$RUNNER_TEMP/x11.out" 2>/dev/null | tr -d '\r' | sed 's/^/::warning title=Linux-X11-Diagnose::/'
          fi
          test -f /usr/share/applications/alupc.desktop
          grep -q '^Exec=/opt/alupc/AluPC$' /usr/share/applications/alupc.desktop
          grep -q '^X-KDE-DBUS-Restricted-Interfaces=org.kde.KWin.ScreenShot2' /usr/share/applications/alupc.desktop
          test -f /usr/share/icons/hicolor/48x48/apps/alupc.png
          test -f /usr/share/icons/hicolor/scalable/apps/alupc.svg
          # Fingerabdruck: apt muss fprintd + libpam-fprintd (empfohlene Pakete) gleich mitinstallieren
          dpkg -s fprintd libpam-fprintd | grep -E '^(Package|Status)'
          grep -q 'Fingerabdruck-Pakete: vollständig' "$RUNNER_TEMP/deb.txt"
          # Fingerabdruckmodul am USB-Seriell-Adapter: Zugriffsregel da, Anmelde-Prüfung läuft (ohne Modul: Nein)
          test -f /usr/lib/udev/rules.d/70-alupc-serial.rules
          grep -q 'pyserial da' "$RUNNER_TEMP/deb.txt"
          set +e; PAM_USER=nobody timeout 30 /opt/alupc/AluPC --fingerabdruck-pam; code=$?; set -e
          test "$code" -eq 1
      - name: Portables Archiv
        run: tar -C dist -czf "dist/AluPC-linux-x86_64-${{ steps.version.outputs.v }}.tar.gz" AluPC
      - uses: actions/upload-artifact@v4
        with:
          name: AluPC-Linux
          path: |
            dist/alupc_*_amd64.deb
            dist/AluPC-linux-x86_64-*.tar.gz
            dist/AluPC-installieren.sh

  build-windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Installieren
        # Nicht „-e“: PyInstaller findet Pakete aus einer Entwicklungs-Installation nicht
        run: pip install ".[test]" pyinstaller
      - name: Tests (Logik + Windows-Strukturen)
        shell: pwsh
        run: |
          python -X faulthandler -m pytest -v -rf tests/test_logic.py 2>&1 | Tee-Object -FilePath logic.log
          if ($LASTEXITCODE -ne 0) {
            Select-String -Path logic.log -Pattern '^(FAILED|E   |ERROR)' | Select-Object -First 40 |
              ForEach-Object { Write-Output ("::error::" + $_.Line.Trim()) }
            # Absturz (z. B. Zugriffsverletzung) hat keine FAILED-Zeilen – dann zeigt das Ende des Protokolls den Grund
            Get-Content logic.log -Tail 20 | ForEach-Object { Write-Output ("::error::" + $_.Trim()) }
            exit 1
          }
      - name: Tests (Oberfläche)
        shell: pwsh
        run: |
          python -X faulthandler -m pytest -v -rf tests/test_gui.py 2>&1 | Tee-Object -FilePath gui.log
          if ($LASTEXITCODE -ne 0) {
            # Fehler als Hinweis (Annotation) ausgeben – die sind auch ohne Anmeldung sichtbar
            # Bei einem Absturz: welcher Test lief gerade? (letzte Testzeile vor „Fatal …“)
            $last = Select-String -Path gui.log -Pattern '^tests/test_gui\.py::' | Select-Object -Last 1
            if ($last) { Write-Output ("::error title=Zuletzt gelaufener Test::" + $last.Line.Trim()) }
            Select-String -Path gui.log -Pattern '^(FAILED|E   |ERROR|Fatal|Windows fatal|  File "D:)' |
              Select-Object -First 40 | ForEach-Object { Write-Output ("::error::" + $_.Line.Trim()) }
            Get-Content gui.log -Tail 60 | Where-Object { $_.Trim() -and $_ -notmatch 'site-packages' } |
              Select-Object -Last 25 | ForEach-Object { Write-Output ("::warning::" + $_.Trim()) }
            exit 1
          }
      - name: AluPC.exe bauen (PyInstaller)
        run: >
          pyinstaller --noconfirm --windowed --name AluPC
          --icon packaging/windows/alupc.ico
          --paths .
          --collect-submodules alupc
          --collect-submodules serial
          --collect-submodules segno
          --collect-all vosk
          --collect-all winrt
          --collect-data alupc
          packaging/pyinstaller_entry.py
      - name: Anmeldebaustein für das Fingerabdruckmodul bauen (C++, MSVC)
        shell: pwsh
        run: |
          cmake -S packaging/windows/credprov -B build/credprov -A x64
          cmake --build build/credprov --config Release
          New-Item -ItemType Directory -Force dist\AluPC\credprov | Out-Null
          Copy-Item build\credprov\Release\AluPCFingerprint.dll dist\AluPC\credprov\
          Get-Item dist\AluPC\credprov\AluPCFingerprint.dll | ForEach-Object { Write-Output "::notice title=Anmeldebaustein::$($_.Name) $([math]::Round($_.Length/1KB)) KB" }
      - name: Anmeldebaustein testen (LogonUI nachgespielt, Modul nachgebaut, Passwort per DPAPI)
        shell: pwsh
        run: |
          [Console]::OutputEncoding = [Text.Encoding]::UTF8
          $pipe = "\\.\pipe\alupc-fp-ci"
          $cfg = Join-Path $env:RUNNER_TEMP "fp.cfg"
          # Einstellung genau so schreiben, wie AluPC es tut (Python, DPAPI Maschine)
          python -c "import sys; sys.path.insert(0,'.'); from alupc.platform import windows_serial_login as w; open(sys.argv[1],'w',encoding='utf-8').write(w.format_config({'port': sys.argv[2], 'baud': 57600, 'capacity': 50, 'users': {'ci-tester': {'domain': '.', 'slots': [3], 'secret': w.protect('Tüt-Geheim 42!')}}}))" $cfg $pipe
          # Plätze-Datei (neue Finger/Personen ohne Adminrechte): Platz 7 steht nur dort → muss trotzdem gelten
          Set-Content -Path (Join-Path $env:RUNNER_TEMP "fingerprint-ci-tester.slots") -Value @("3,7", "7=Lena") -Encoding ascii
          $fake = Start-Process python -ArgumentList "tests\fake_zw101_pipe.py", $pipe, "7" -PassThru -NoNewWindow -RedirectStandardOutput "$env:RUNNER_TEMP\fake.txt"
          Start-Sleep -Seconds 2
          $out = & build\credprov\Release\cptest.exe $cfg 20
          $out | ForEach-Object { Write-Output $_ }
          $fake | Wait-Process -Timeout 10 -ErrorAction SilentlyContinue
          Get-Content "$env:RUNNER_TEMP\fake.txt" -ErrorAction SilentlyContinue
          $text = $out -join "`n"
          if ($text -notmatch "CPTEST-OK" -or $text -notmatch "USER=ci-tester" -or $text -notmatch "PASS=Tüt-Geheim 42!" -or $text -notmatch "MSG=Hallo Lena – melde an …") {
            Write-Output "::error title=Anmeldebaustein::$($text -replace "`n", ' | ')"; exit 1
          }
          # Begrüßung: erkannter Platz steht in der Registry (Test: HKCU statt HKLM)
          $last = (Get-ItemProperty -Path "HKCU:\SOFTWARE\AluPC\Fingerprint" -Name "ci-tester" -ErrorAction SilentlyContinue)."ci-tester"
          if ($last -notmatch '^7;\d{9,}$') { Write-Output "::error title=Begrüßung::Platz nicht gemerkt: '$last'"; exit 1 }
          Write-Output "::notice title=Anmeldebaustein::Finger erkannt → Anmeldung für ci-tester gebaut, Passwort aus DPAPI korrekt · Begrüßung merkt Platz $last"
          # Einrichten wie AluPC (Admin): Datei schützen, bei Windows anmelden, wieder abmelden
          python -c "import sys; sys.path.insert(0,'.'); from pathlib import Path; from alupc.platform import windows_serial_login as w; p=Path(sys.argv[1]); w.apply_request({'action':'an','user':'ci-tester','domain':'.','slots':[7],'port':'COM9','baud':57600,'capacity':50,'secret':w.protect('x'),'sid':w.current_sid()}, path=p, dll=Path(sys.argv[2])); assert w.registered(), 'nicht registriert'; assert w._default_provider() == w.CLSID, 'nicht vorausgewählt';sp=w.slots_path('ci-tester', p.parent); assert sp.is_file(), 'keine Plätze-Datei'; sp.write_text(w.format_slots([7, 12])); print('SLOTS', sp.read_text().strip(), __import__('subprocess').run(['icacls', str(sp)], capture_output=True, text=True).stdout.replace(chr(10),' ')); print('ACL', __import__('subprocess').run(['icacls', str(p)], capture_output=True, text=True).stdout.replace(chr(10),' ')); w.apply_request({'action':'aus','user':'ci-tester','slots':[]}, path=p); assert not w.registered() and not p.exists() and not sp.exists() and not w._default_provider(), 'nicht abgemeldet'; print('REG-OK')" "$env:RUNNER_TEMP\fp-reg.cfg" "$PWD\dist\AluPC\credprov\AluPCFingerprint.dll"
          if ($LASTEXITCODE -ne 0) { Write-Output "::error title=Anmeldebaustein::Registrieren/Abmelden fehlgeschlagen"; exit 1 }
      - name: Fertige AluPC.exe starten (Selbsttest)
        shell: pwsh
        run: |
          $log = Join-Path $env:RUNNER_TEMP "selbsttest.txt"
          $p = Start-Process -FilePath dist\AluPC\AluPC.exe -ArgumentList "--selbsttest", $log -Wait -PassThru
          if (Test-Path $log) { Get-Content $log }
          # Diagnose (u. a. echte Probe-Aufnahme fürs Spiegeln) als Hinweise im Lauf sichtbar machen
          if (Test-Path $log) { Get-Content $log | Where-Object { $_ -like "DIAG *" } | ForEach-Object { Write-Output "::notice title=Windows-Diagnose::$($_.Substring(5))" } }
          if ($p.ExitCode -ne 0) { throw "AluPC.exe Selbsttest fehlgeschlagen (Exit-Code $($p.ExitCode))" }
      - name: AirPlay echt – uxplay-windows über winget installieren und von AluPC starten lassen
        shell: pwsh
        continue-on-error: true
        timeout-minutes: 10
        run: |
          foreach ($id in "Apple.Bonjour", "leapbtw.uxplay") {
            $out = winget install --id $id -e --silent --accept-source-agreements --accept-package-agreements 2>&1 | Select-Object -Last 2
            Write-Output "::notice title=AirPlay-Probe::winget $id -> $($out -join ' | ')"
          }
          Get-Process | Where-Object { $_.Name -match "uxplay" } | ForEach-Object { Write-Output "::notice title=AirPlay-Probe::läuft schon nach Installation: $($_.Name)" }
          $n = @(Get-Process explorer -ErrorAction SilentlyContinue).Count
          Write-Output "::notice title=AirPlay-Probe::Explorer (Taskleiste/Tray) läuft: $n Prozess(e)"
          # pythonw: ohne eigene Konsole – sonst schreibt uxplay-windows (AttachConsole) an AluPC vorbei
          $out = Join-Path $env:RUNNER_TEMP "airplay-probe.txt"
          $p = Start-Process -FilePath (Join-Path (Split-Path (Get-Command python).Source) "pythonw.exe") -ArgumentList ".github/scripts/airplay_probe.py" -RedirectStandardOutput $out -RedirectStandardError "$out.err" -Wait -PassThru -NoNewWindow
          Get-Content $out -ErrorAction SilentlyContinue
          Write-Output "::notice title=AirPlay-Probe-Ende::Exit $($p.ExitCode) · $((Get-Content "$out.err" -ErrorAction SilentlyContinue | Select-Object -Last 6) -join ' | ')"
      - name: Firewall-Freigabe für AirPlay (alle Netzwerktypen, Sperr-Regeln für UxPlay ersetzen)
        shell: pwsh
        continue-on-error: true
        run: python .github/scripts/firewall_probe.py
      - name: Fenster-Probe – iPhone-Fenster randlos im Vordergrund platzieren (echter Desktop)
        shell: pwsh
        continue-on-error: true
        run: |
          $env:QT_QPA_PLATFORM = "windows"
          python .github/scripts/present_probe.py
      - name: Spiegel-Probe auf dem echten Windows-Desktop
        shell: pwsh
        continue-on-error: true
        run: |
          $log = Join-Path $env:RUNNER_TEMP "desktop.txt"
          $env:QT_QPA_PLATFORM = "windows"
          $p = Start-Process -FilePath dist\AluPC\AluPC.exe -ArgumentList "--selbsttest", $log -Wait -PassThru
          Write-Output "::notice title=Windows-Desktop-Diagnose::Exit-Code $($p.ExitCode)"
          if (Test-Path $log) { Get-Content $log | Where-Object { $_ -like "DIAG *" -and ($_ -like "*Aufnahme*" -or $_ -like "*bei 0*" -or $_ -like "*Monitor*" -or $_ -like "*Spiegel*" -or $_ -like "*Schrift*") } | ForEach-Object { Write-Output "::notice title=Windows-Desktop-Diagnose::$($_.Substring(5))" } }
          # Treiber für Fingerabdruckmodule am seriellen Anschluss (HLK-ZW101) muss in der .exe stecken
          if (-not (Select-String -Path $log -Pattern "pyserial da" -Quiet)) { throw "pyserial fehlt in AluPC.exe" }
      - name: Version bestimmen
        id: version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then echo "v=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT";
          else echo "v=$(python -c 'import alupc; print(alupc.__version__)')" >> "$GITHUB_OUTPUT"; fi
      - name: Installer bauen (Inno Setup)
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          & $iscc "/DAppVersion=${{ steps.version.outputs.v }}" packaging\windows\alupc.iss
      - name: Installer still installieren und starten (Test)
        shell: pwsh
        run: |
          $setup = Get-ChildItem dist\AluPC-Setup-*.exe | Select-Object -First 1
          $p = Start-Process -FilePath $setup.FullName -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/CURRENTUSER", "/MERGETASKS=!handy", "/DIR=$env:RUNNER_TEMP\AluPC-inst" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Installer fehlgeschlagen (Exit-Code $($p.ExitCode))" }
          $log = Join-Path $env:RUNNER_TEMP "inst.txt"
          $q = Start-Process -FilePath "$env:RUNNER_TEMP\AluPC-inst\AluPC.exe" -ArgumentList "--selbsttest", $log -Wait -PassThru
          if (Test-Path $log) { Get-Content $log }
          if ($q.ExitCode -ne 0) { throw "Installiertes AluPC startet nicht (Exit-Code $($q.ExitCode))" }
      - name: Portable ZIP
        shell: pwsh
        run: Compress-Archive -Path dist\AluPC\* -DestinationPath dist\AluPC-windows-portable-${{ steps.version.outputs.v }}.zip
      - uses: actions/upload-artifact@v4
        with:
          name: AluPC-Windows
          path: |
            dist/AluPC-Setup-*.exe
            dist/AluPC-windows-portable-*.zip

  release:
    # Release bei einem Tag „v…“ oder bei einem Commit auf main mit „[release]“ in der Nachricht
    if: >-
      startsWith(github.ref, 'refs/tags/v') ||
      (github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[release]'))
    needs: [test-linux, build-linux, build-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Version bestimmen
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT";
          else echo "tag=v$(python3 -c 'import alupc; print(alupc.__version__)')" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - name: Release veröffentlichen
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: AluPC ${{ steps.version.outputs.tag }}
          body_path: packaging/RELEASE_NOTES.md
          files: release/*
