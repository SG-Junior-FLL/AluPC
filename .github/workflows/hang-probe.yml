# Fehlersuche: Windows-Oberflächentest hängt nach test_theme_switch (test_crossfade_layer_is_removed, in env/pump).
# Drei Varianten je 8 Läufe – welche hängt? Läuft nur bei Änderungen an dieser Datei oder von Hand.
name: Hänger-Probe (Windows)
on:
  workflow_dispatch:
  push:
    paths: [".github/workflows/hang-probe.yml"]
jobs:
  probe:
    runs-on: windows-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        variant: [beide, ohne-titelleiste, nur-crossfade]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ".[test]"
      - name: 8 Läufe
        shell: pwsh
        run: |
          $env:ALUPC_TEST_HANG_EXIT = "60"
          $k = "test_theme_switch or test_crossfade_layer_is_removed"
          if ("${{ matrix.variant }}" -eq "ohne-titelleiste") { $env:ALUPC_NO_TITLEBAR = "1" }
          if ("${{ matrix.variant }}" -eq "nur-crossfade") { $k = "test_crossfade_layer_is_removed" }
          $ok = 0; $hang = 0
          for ($i = 1; $i -le 8; $i++) {
            python -X faulthandler -m pytest -q -p no:cacheprovider tests/test_gui.py -k $k 2>&1 | Out-File -FilePath "lauf$i.log"
            if ($LASTEXITCODE -eq 0) { $ok++ } else { $hang++; Get-Content gui-haenger.txt -ErrorAction SilentlyContinue | Select-Object -First 3 | ForEach-Object { Write-Output "::warning title=Lauf $i::$_" } }
          }
          Write-Output "::notice title=${{ matrix.variant }}::$ok von 8 ok, $hang hängen/fehlen"
