# Fehlersuche: Windows-Oberflächentest hängt nach test_theme_switch (test_crossfade_layer_is_removed, in env/pump).
# Runde 1 (nur die 2 Tests, 3 Varianten × 8): nie gehangen → es sammelt sich über viele Tests an.
# Runde 2: ganze tests/test_gui.py, 4 Varianten × 4 Läufe – hängt in jeder Variante (Ton, Mausgrenze, Titelleiste
# sind es nicht). Runde 3: Abbild im eigenen Prozess blieb selbst hängen (Verdacht: Loader-Lock).
# Runde 5: Ressourcen je Test mitschreiben + Qt-Fehlermeldungen sichtbar (Verdacht: Windows-Limit).
# Runde 4b: Lauf 1 grün, Lauf 2+3 „Windows fatal exception“ (Absturz, nicht nur Hänger) → Absturzstapel zeigen.
# Runde 4 brach nach Sekunden ab (Fehler in der Probe selbst) – jetzt mit Logzeilen.
# Runde 4: Abbild von einem getrennten Prozess, offline mit cdb: Besitzer des Loader-Locks + Stapel.
name: Hänger-Probe (Windows)
on:
  workflow_dispatch:
  push:
    paths: [".github/workflows/hang-probe.yml"]
jobs:
  probe:
    runs-on: windows-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        variant: [abbild]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ".[test]"
      - name: Bis zum ersten Hänger laufen, Speicherabbild schreiben
        shell: pwsh
        timeout-minutes: 34
        run: |
          $env:ALUPC_TEST_HANG_EXIT = "120"
          $env:ALUPC_TEST_MINIDUMP = "1"
          $env:QT_FORCE_STDERR_LOGGING = "1"  # qFatal-Meldung von Qt landet sonst unsichtbar in OutputDebugString
          for ($i = 1; $i -le 4; $i++) {
            $env:ALUPC_TEST_RESLOG = "$PWD\res$i.txt"
            python -X faulthandler -m pytest -q -p no:cacheprovider tests/test_gui.py 2>&1 | Out-File -FilePath "lauf$i.log"
            $res = Get-Content "res$i.txt" -ErrorAction SilentlyContinue
            if ($res) { Write-Output ("::notice title=Ressourcen $i::" + (@($res[0], $res[[int]($res.Count/2)], $res[-3], $res[-2], $res[-1]) -join ' | ')) }
            $qt = $log = Get-Content "lauf$i.log" | Select-String -Pattern 'QWindows|qt\.|Failed to|ASSERT|fatal|Cannot|could not' | Select-Object -First 6
            if ($qt) { Write-Output ("::notice title=Qt-Meldungen $i::" + (($qt | ForEach-Object { $_.Line.Trim() }) -join ' | ')) }
            $log = Get-Content "lauf$i.log"
            $at = ($log | Select-String -Pattern 'Windows fatal exception|Fatal Python error|Timeout \(' | Select-Object -First 1).LineNumber
            if ($at) {
              # GitHub zeigt nur 10 Warnungen je Schritt → alles in EINE Meldung: Fehlerzeile, dann der abstürzende Thread
              $cur = ($log | Select-String -Pattern '^Current thread' | Select-Object -First 1).LineNumber
              $part = @($log[$at - 1]) + @($log[($at - 3)..($at - 2)])
              if ($cur) { $part += $log[($cur - 1)..($cur + 25)] }
              $msg = ($part | Where-Object { $_.Trim() } | ForEach-Object { $_.Trim() -replace 'C:\\hostedtoolcache\\windows\\Python\\3.12.10\\x64\\Lib\\', '' -replace 'D:\\a\\AluPC\\AluPC\\', '' }) -join ' | '
              Write-Output ("::error title=Lauf $i Absturz::" + $msg.Substring(0, [Math]::Min(3500, $msg.Length)))
            }
            else { $log | Select-Object -Last 3 | ForEach-Object { Write-Output ("::notice title=Lauf $i::" + $_.Trim()) } }
            Get-Content gui-haenger-nativ.txt -ErrorAction SilentlyContinue | ForEach-Object { Write-Output "::notice title=Abbild $i::$_" }
            if (Test-Path gui-haenger.dmp) { Write-Output "::notice title=Abbild::Lauf $i hängt – $(Get-Content gui-haenger.txt -First 1)"; break }
          }
      - name: Abbild auswerten (C++-Stapel aller Threads)
        if: always()
        shell: pwsh
        run: |
          if (-not (Test-Path gui-haenger.dmp)) { Write-Output "::notice title=Abbild::kein Hänger in 5 Läufen"; exit 0 }
          $cdb = (Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\Debuggers\x64\cdb.exe" -ErrorAction SilentlyContinue | Select-Object -First 1).FullName
          $env:_NT_SYMBOL_PATH = "srv*C:\sym*https://msdl.microsoft.com/download/symbols"
          & $cdb -z gui-haenger.dmp -c "!cs -o ntdll!LdrpLoaderLock; ~0kn 30; ~*kn 14; q" 2>&1 | Out-File -FilePath stapel.txt
          Get-Content gui-haenger-nativ.txt -ErrorAction SilentlyContinue | ForEach-Object { Write-Output "::notice title=Abbild::$_" }
          Get-Content stapel.txt | Select-String -Pattern 'OwningThread|LockCount|Critsec' | ForEach-Object { Write-Output ("::warning title=Loader-Lock::" + $_.Line.Trim()) }
          $main = Get-Content stapel.txt | Where-Object { $_ -match '^\s*[0-9a-f]{2} [0-9a-f`]+ [0-9a-f`]+ |^\s*[#.]?\s*\d+\s+Id: ' } | Select-Object -First 48
          $main | ForEach-Object { Write-Output ("::warning title=Stapel::" + ($_ -replace '\s+', ' ').Trim()) }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: haenger-abbild
          path: |
            stapel.txt
            gui-haenger.txt
            lauf*.log
          if-no-files-found: ignore
