# Fehlersuche: Windows-Oberflächentest hängt nach test_theme_switch (test_crossfade_layer_is_removed, in env/pump).
# Runde 1 (nur die 2 Tests, 3 Varianten × 8): nie gehangen → es sammelt sich über viele Tests an.
# Runde 2: ganze tests/test_gui.py, 4 Varianten × 4 Läufe – hängt in jeder Variante (Ton, Mausgrenze, Titelleiste
# sind es nicht). Runde 3: beim Hänger ein Speicherabbild schreiben und offline mit cdb die C++-Stapel lesen.
name: Hänger-Probe (Windows)
on:
  workflow_dispatch:
  push:
    paths: [".github/workflows/hang-probe.yml"]
jobs:
  probe:
    runs-on: windows-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        variant: [abbild]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ".[test]"
      - name: Bis zum ersten Hänger laufen, Speicherabbild schreiben
        shell: pwsh
        timeout-minutes: 30
        run: |
          $env:ALUPC_TEST_HANG_EXIT = "120"
          $env:ALUPC_TEST_MINIDUMP = "1"
          for ($i = 1; $i -le 5; $i++) {
            python -X faulthandler -m pytest -q -p no:cacheprovider tests/test_gui.py 2>&1 | Out-File -FilePath "lauf$i.log"
            if (Test-Path gui-haenger.dmp) { Write-Output "::notice title=Abbild::Lauf $i hängt – $(Get-Content gui-haenger.txt -First 1)"; break }
          }
      - name: Abbild auswerten (C++-Stapel aller Threads)
        if: always()
        shell: pwsh
        run: |
          if (-not (Test-Path gui-haenger.dmp)) { Write-Output "::notice title=Abbild::kein Hänger in 5 Läufen"; exit 0 }
          $cdb = (Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\Debuggers\x64\cdb.exe" -ErrorAction SilentlyContinue | Select-Object -First 1).FullName
          $env:_NT_SYMBOL_PATH = "srv*C:\sym*https://msdl.microsoft.com/download/symbols"
          & $cdb -z gui-haenger.dmp -c "~0kn 40; ~*kn 12; q" 2>&1 | Out-File -FilePath stapel.txt
          $main = Get-Content stapel.txt | Where-Object { $_ -match '^\s*[0-9a-f]{2} [0-9a-f`]+ [0-9a-f`]+ ' } | Select-Object -First 45
          $main | ForEach-Object { Write-Output ("::warning title=Stapel::" + ($_ -replace '\s+', ' ').Trim()) }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: haenger-abbild
          path: |
            stapel.txt
            gui-haenger.txt
            lauf*.log
          if-no-files-found: ignore
