name: Portal-Windows-Test
on:
  push:
    branches: [win-ics-test]
jobs:
  portal-windows:
    # Eigener Job auf Windows Server 2022: dort liegt das Container-Abbild fürs „Handy“ schon bereit
    runs-on: windows-2022
    timeout-minutes: 40
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Installieren
        run: pip install -e .
      - name: Mobilen Hotspot nachbauen (Windows-Internetfreigabe, Handy = Container)
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File tests/windows/hotspot_sim.ps1
      - name: WLAN-Anmeldeseite echt – Handy im Hotspot-Netz (DNS, Weiterleitung, Mitspielen, keine Umgehung)
        shell: bash
        run: |
          python tests/portal_windows_check.py mcr.microsoft.com/windows/servercore:ltsc2022 2>&1 | tee portal.log
          test "${PIPESTATUS[0]}" -eq 0 || { grep "FEHL" portal.log | sed 's/^/::error title=Anmeldeseite (Windows)::/'; exit 1; }
          echo "::notice title=Anmeldeseite (Windows)::$(grep -E '^  (OK|FEHL)|bestanden' portal.log | tr -d '\r' | sed 's/%/%25/g' | sed ':a;N;$!ba;s/\n/%0A/g')"

